name = "praxevo-site"
compatibility_date = "2024-09-23"
pages_build_output_dir = "_site"

# Rate-limiting store used by functions/api/contact.js.
# Create with: npx wrangler kv namespace create CONTACT_RL
# then paste the returned id below (and add the same binding name
# in the Cloudflare Pages dashboard → Settings → Functions → KV namespace bindings
# for both Production and Preview).
[[kv_namespaces]]
binding = "CONTACT_RL"
id = "841090f7c1c54c03ad64ec185dbd08d1"

[vars]
CONTACT_TO_EMAIL = "hola@somospraxevo.com"
CONTACT_FROM_EMAIL = "PraxEvo <no-reply@somospraxevo.com>"

# Secrets (RESEND_API_KEY, TURNSTILE_SECRET_KEY) are NOT set here — configure them
# in the Cloudflare Pages dashboard → Settings → Variables and secrets, or with
# `npx wrangler pages secret put <NAME>`. Never commit real secrets to this file.
#
# TURNSTILE_SITE_KEY no va aquí y ya no hay que exportarla (corregido 2026-08-17).
# Vive versionada en src/_data/turnstile.json y es el valor por defecto del build.
# Ponerla en [vars] NO funcionaría: [vars] es un binding de runtime para Functions, no una
# variable de build, y Eleventy la lee en build time. Lo mismo pasa con un secreto del
# dashboard, que también es runtime-only. Ver README, sección 4.
